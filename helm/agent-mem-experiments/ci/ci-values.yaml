# CI render (app-build-suite `helm template`) with both components on.
# Dummy secrets and Secret names: CI never installs these values.
agentmemory:
  enabled: true
  secret:
    create: true
    agentmemorySecret: ci-dummy-agentmemory-secret
    geminiApiKey: ci-dummy-gemini-api-key
cartographer:
  enabled: true
  auth:
    existingSecret: cartographer-tokens
  credentials:
    existingSecret: cartographer-credentials
  ui:
    exposed: true
