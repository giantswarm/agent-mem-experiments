{{- if and .Values.agentmemory.enabled .Values.agentmemory.networkPolicy.enabled }}
{{- $ctx := dict "root" $ "component" "agentmemory" }}
{{- $np := .Values.agentmemory.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-mem.fullname" $ctx }}
  labels:
    {{- include "agent-mem.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-mem.selectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- with $np.ingressNamespaces }}
    # The REST/MCP port, from the gateway's namespace only.
    - ports:
        - port: 3111
          protocol: TCP
      from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
    {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with $np.egressHttpsCidrs }}
    # Gemini API.
    - ports:
        - port: 443
          protocol: TCP
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
