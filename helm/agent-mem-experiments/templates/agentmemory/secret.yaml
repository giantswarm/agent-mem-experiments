{{- if .Values.agentmemory.enabled }}
{{- $ctx := dict "root" $ "component" "agentmemory" }}
{{- $am := .Values.agentmemory }}
{{- if $am.secret.create }}
{{- /* CI and tests only: production references secret.existingSecret. */}}
{{- if $am.secret.existingSecret }}
{{- fail "agentmemory: set either secret.existingSecret or secret.create, not both" }}
{{- end }}
{{- if not $am.secret.agentmemorySecret }}
{{- fail "agentmemory: secret.create needs secret.agentmemorySecret (openssl rand -hex 32)" }}
{{- end }}
{{- $usesGemini := or (eq $am.llmProvider "gemini") (eq $am.embeddingProvider "gemini") }}
{{- if and $usesGemini (not $am.secret.geminiApiKey) }}
{{- fail "agentmemory: secret.create with a gemini llmProvider or embeddingProvider needs secret.geminiApiKey" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-mem.fullname" $ctx }}
  labels:
    {{- include "agent-mem.labels" $ctx | nindent 4 }}
type: Opaque
stringData:
  AGENTMEMORY_SECRET: {{ $am.secret.agentmemorySecret | quote }}
  {{- with $am.secret.geminiApiKey }}
  GEMINI_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
