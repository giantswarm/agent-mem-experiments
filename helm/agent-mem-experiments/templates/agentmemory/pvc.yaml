{{- if .Values.agentmemory.enabled }}
{{- $ctx := dict "root" $ "component" "agentmemory" }}
{{- with .Values.agentmemory.persistence }}
{{- if and .enabled (not .existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agent-mem.fullname" $ctx }}
  labels:
    {{- include "agent-mem.labels" $ctx | nindent 4 }}
  annotations:
    # The store outlives the release; delete the PVC by hand.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .accessMode }}
  {{- with .storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .size }}
{{- end }}
{{- end }}
{{- end }}
