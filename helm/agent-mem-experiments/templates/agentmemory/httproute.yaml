{{- if and .Values.agentmemory.enabled .Values.agentmemory.httpRoute.enabled }}
{{- $ctx := dict "root" $ "component" "agentmemory" }}
{{- $fullname := include "agent-mem.fullname" $ctx }}
{{- $route := .Values.agentmemory.httpRoute }}
{{- if not .Values.gateway.parentRefs }}
{{- fail "agentmemory: httpRoute.enabled needs gateway.parentRefs" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "agent-mem.labels" $ctx | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # Only the agentmemory API; the viewer stays on loopback in the pod.
    - matches:
        - path:
            type: PathPrefix
            value: /agentmemory
      backendRefs:
        - name: {{ $fullname }}
          port: {{ .Values.agentmemory.service.port }}
{{- end }}
