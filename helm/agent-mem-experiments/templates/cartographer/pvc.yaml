{{- if .Values.cartographer.enabled }}
{{- $p := .Values.cartographer.persistence }}
{{- if not $p.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agent-mem.fullname" (dict "root" $ "component" "cartographer") }}-data
  labels:
    {{- include "agent-mem.labels" (dict "root" $ "component" "cartographer") | nindent 4 }}
  annotations:
    # Kept on uninstall: it holds commits not pushed yet and the audit log.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with $p.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size | quote }}
{{- end }}
{{- end }}
