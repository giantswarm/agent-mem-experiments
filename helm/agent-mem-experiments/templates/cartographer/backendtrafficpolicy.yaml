{{- if .Values.cartographer.enabled }}
{{- $c := .Values.cartographer }}
{{- if and $c.httpRoute.enabled $c.httpRoute.backendTrafficPolicy.enabled }}
{{- $fullname := include "agent-mem.fullname" (dict "root" $ "component" "cartographer") }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "agent-mem.labels" (dict "root" $ "component" "cartographer") | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $fullname }}
  # Tool calls such as a reindex or a git sync have no fixed upper bound.
  timeout:
    http:
      requestTimeout: {{ $c.httpRoute.backendTrafficPolicy.timeout | quote }}
{{- end }}
{{- end }}
